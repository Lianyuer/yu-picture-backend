server:
  port: 8123
  servlet:
    context-path: /api

spring:
  application:
    name: ty-picture-backend
  #数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yu_picture
    username: root
    password: 123456
  # Redis
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    timeout: 5000
  # 增加上传文件的最大限制体积
  servlet:
    multipart:
      max-file-size: 10MB
mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: true # 将下划线命名的数据库字段名转换为驼峰命名的Java实体类属性名
    # 仅在开发环境启用打印日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: is_deleted
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑已删除值（默认为 0）

# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: v1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.yu.yupicturebackend.controller